<!DOCTYPE html>
<html lang="en">
  <head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://labshuai.github.io/shuailab_website/">
    <link rel="alternate" hreflang="en" href="https://labshuai.github.io/shuailab_website/en/">
    <link rel="alternate" hreflang="zh-CN" href="https://labshuai.github.io/shuailab_website/zh/">
    <link rel="alternate" hreflang="x-default" href="https://labshuai.github.io/shuailab_website/">
    <title>Shuai Wang Tri Lab</title>
    <script>
      (() => {
        const saved = window.localStorage.getItem("site-language");
        const browserLanguage = navigator.language || "";
        const language = saved || (browserLanguage.toLowerCase().startsWith("zh") ? "zh" : "en");
        const destinations = {
          en: "/shuailab_website/en/",
          zh: "/shuailab_website/zh/"
        };
        window.location.replace(destinations[language] || destinations.en);
      })();
    </script>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #111d29;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      main { text-align: center; }
      a { color: #fff; margin: 0 0.75rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Shuai Wang Tri Lab</h1>
      <p><a href="/shuailab_website/en/">English</a> · <a href="/shuailab_website/zh/">中文</a></p>
    </main>
  </body>
</html>
