{% assign lang = page.lang | default: "en" %}
{% assign ui = site.data.i18n[lang] %}
<div
  class="search-box"
  data-showing-template="{{ ui.showing_results | xml_escape }}"
  data-clear-label="{{ ui.clear_search | xml_escape }}"
>
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="{{ ui.search_placeholder }}"
  />
  <button
    disabled
    data-tooltip="{{ ui.clear_search }}"
    aria-label="{{ ui.clear_search }}"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
