{% assign lang = page.lang | default: "en" %}
{% assign ui = site.data.i18n[lang] %}
{% assign image_link = include.image_link | default: include.link %}

<div
  class="feature"
  {% if include.flip %}
    data-flip
  {% endif %}
  {% if include.image_fit %}
    data-image-fit="{{ include.image_fit | xml_escape }}"
  {% endif %}
>
  <a
    {% if image_link %}
      href="{{ image_link | relative_url | uri_escape }}"
    {% endif %}
    class="feature-image"
    aria-label="{% if include.image_link %}{{ ui.view_full_size_image }} {% endif %}{{ include.title | default: ui.feature_link | regex_strip }}"
  >
    <img
      src="{{ include.image | relative_url | uri_escape }}"
      loading="lazy"
      alt="{{ include.title | default: ui.feature_image | regex_strip }}"
      {% include fallback.html %}
    >
  </a>
  <div class="feature-text">
    {% if include.title %}
      <p class="feature-title">{{ include.title }}</p>
    {% endif %}
    {{ include.text | markdownify }}
  </div>
</div>
