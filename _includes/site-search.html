<form onsubmit="onSiteSearchSubmit(event)">
  <input type="text" name="query" placeholder="{{ include.placeholder | default: 'Search site with Google' }}" />
  <button type="submit" class="button" aria-label="{{ include.label | default: 'Search site' }}">
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</form>
