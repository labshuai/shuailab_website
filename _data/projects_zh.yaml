retinal-vascular-disease:
  title: 视网膜血管疾病与退行性病变的炎症免疫机制
  subtitle: 基因治疗与靶向小分子治疗
  description: >-
    我们研究驱动视网膜血管疾病和视网膜退行性病变的炎症与免疫机制，
    并将相关发现转化为基因治疗和靶向小分子治疗策略，以保护视网膜结构和视觉功能。
  tags:
    - 视网膜疾病
    - 炎症
    - 免疫学
    - 基因治疗
    - 小分子治疗

dry-eye-corneal-disease:
  title: 干眼及角膜疾病的机制与转化研究
  subtitle: 纳米药物递送、人工智能与先进生物材料
  description: >-
    我们研究干眼及相关角膜疾病的发病机制，并将相关认识转化为新的治疗平台。
    研究整合纳米药物递送、人工智能辅助发现与设计，以及先进的结构工程生物材料，
    以促进眼表修复并提高治疗的持久性。
  tags:
    - 干眼
    - 角膜疾病
    - 纳米医学
    - 人工智能
    - 生物材料

