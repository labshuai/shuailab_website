- key: retinal-vascular-disease
  title: Inflammation and Immunity in Retinal Vascular Disease and Degeneration
  subtitle: Gene Therapy and Targeted Small-Molecule Therapeutics
  group: featured
  image: images/project.jpg
  image_fit: panorama
  image_link: images/project.jpg
  description: >-
    We investigate the inflammatory and immune mechanisms that drive retinal
    vascular disease and retinal degeneration, translating these discoveries
    into gene therapies and targeted small-molecule treatments that preserve
    retinal structure and visual function.
  tags:
    - retinal disease
    - inflammation
    - immunology
    - gene therapy
    - small-molecule therapy

- key: dry-eye-corneal-disease
  title: Translational Research in Dry Eye and Corneal Disease
  subtitle: Nanodrug Delivery, AI, and Advanced Biomaterials
  group: featured
  image: images/dry_eye.jpg
  description: >-
    We investigate the mechanisms underlying dry eye and related corneal
    diseases and translate these insights into new therapeutic platforms. Our
    work integrates nanodrug delivery, AI-guided discovery and design, and
    advanced structurally engineered biomaterials to promote ocular surface
    repair and improve treatment durability.
  tags:
    - dry eye
    - corneal disease
    - nanomedicine
    - artificial intelligence
    - biomaterials

