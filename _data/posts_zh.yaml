corneal-transplantation-four-year-old-patient:
  title: 角膜移植为四岁患儿带来新希望
  tags:
    - 角膜移植
    - 临床诊疗
  content: >-
    大连医科大学附属第二医院王帅医生及眼科团队成功为一名患有角膜缘皮样瘤的四岁患儿实施角膜移植手术。
    据医院报道，患儿视力由术前的0.1提高至术后第一天的0.4。
    [阅读医院报道](https://www.shdmu.com/web/details/index?cnId=12215&coid=23)。

protective-pathway-hypertensive-retinopathy:
  title: 新研究探索高血压性视网膜病变的保护通路
  tags:
    - 高血压性视网膜病变
    - 炎症
    - 论文发表
  content: >-
    我们发表于《Journal of Translational Medicine》的研究表明，褐藻多糖可能通过调控SIRT1/NLRP3通路，
    减轻血管紧张素II诱导的高血压性视网膜病变。研究结果支持进一步探索针对炎症的高血压性视网膜损伤治疗策略。
    [阅读论文](https://doi.org/10.1186/s12967-024-04877-6)。

secondary-glaucoma-congenital-cataract-surgery:
  title: 系统综述评估先天性白内障术后继发性青光眼
  tags:
    - 青光眼
    - 先天性白内障
    - 系统综述
  content: >-
    我们的系统综述和Meta分析已发表于《American Journal of Ophthalmology》。
    该研究纳入36项研究、3,151名儿童和4,717只眼，估算先天性白内障手术后继发性青光眼的总体发生率为6.6%。
    [阅读论文](https://doi.org/10.1016/j.ajo.2024.04.021)。

retinal-imaging-study-ieee-transactions:
  title: 合作开展的视网膜成像研究发表于IEEE Transactions on Instrumentation and Measurement
  tags:
    - 视网膜成像
    - OCT
    - 论文发表
  content: >-
    我们参与的一项多学科研究开发了高速扫频OCT/OCTA/ORG平台，用于活体小鼠视网膜的结构与功能成像。
    该集成系统能够快速、高分辨率地呈现视网膜结构、血管以及光诱发反应。
    [阅读论文](https://doi.org/10.1109/TIM.2025.3606015)。

inflammatory-proteins-primary-open-angle-glaucoma:
  title: 新研究发现与原发性开角型青光眼相关的炎症蛋白
  tags:
    - 青光眼
    - 炎症
    - 论文发表
  content: >-
    我们合作完成的研究《Causal association between 91 circulating inflammatory proteins and primary open-angle glaucoma: a bidirectional Mendelian randomization study》
    已发表于《Cytokine》。研究提示FGF-19、IL-18、IL-18R1和LIF可能成为潜在治疗靶点，
    并为原发性开角型青光眼的预防和管理提供了新的认识。
    [阅读论文](https://doi.org/10.1016/j.cyto.2025.157007)。

nano-hydrogen-therapy-dry-eye:
  title: 新项目探索纳米氢治疗干眼的机制与转化潜力
  tags:
    - 干眼
    - 线粒体功能障碍
    - 科研项目
  content: >-
    由大连医科大学附属第二医院王帅医生牵头的科研项目入选2025年大连市生命健康指导计划，项目经费60万元。
    项目题为《“纳米氢疗法”治疗干眼：基于眼表线粒体功能障碍调控的机制与转化研究》
    （项目编号：2025ZDJH01PT092），实施时间为2026年1月1日至2027年12月31日。
    研究将探索纳米氢疗法调控眼表线粒体功能障碍的作用，并评估其治疗干眼的机制与转化潜力。
    项目基于线粒体功能障碍、氧化应激和炎症与干眼病理过程之间日益丰富的研究证据；
    但分子氢的临床疗效和最佳递送方式仍需进一步验证。
    [了解王帅医生的临床与科研工作](https://www.shdmu.com/web/details/index?cnId=13779&coid=18&ctId=49)。
