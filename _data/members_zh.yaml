shuai_wang:
  name: Shuai Wang
  bio: >-
    王帅，医学博士，哈佛医学院博士后，硕士研究生导师，大连医科大学附属第二医院角膜病与角膜移植中心负责人。
    她是中国老年医学学会眼科学分会委员，并创建了大连医科眼科干眼门诊，该门诊获评干眼诊疗示范基地。
    作为哈佛医学院Cepko院士团队的核心成员，她参与了眼科FDA临床转化项目，并获评麻省总医院眼科优秀Fellow。

    她主持了国家自然科学基金、辽宁省自然科学基金、中央引导地方科技发展项目和大连市杰出青年科技人才基金等多项科研项目，
    并获评大连市杰出青年科技人才。她已在Redox Biology、Molecular Therapy和IOVS等期刊发表论文20余篇，
    以第一作者或通讯作者发表多篇高影响力研究，总影响因子超过100。相关成果获辽宁省自然科学学术成果一等奖。
    她拥有10项发明专利，其中3项已获授权、2项实现成果转化；曾获第九届中国临床创新与发明大赛三等奖，
    其医工融合创业项目入选大连市创新创业高成长企业储备项目。

jing_li:
  name: Jing Li
  bio: >-
    李静，医学博士，心血管内科副主任医师、副研究员、硕士研究生导师。她主要研究天然产物的治疗潜力以及蛋白质泛素化的调控作用。
    她主持国家自然科学基金、辽宁省自然科学基金等项目，相关成果发表于Hypertension等期刊，
    并获辽宁省自然科学学术成果奖和大连市青年人才称号。她重视研究生创新能力培养，指导学生在多项学术竞赛中获奖。

jie_bai:
  name: Jie Bai
  bio: >-
    白洁，中共党员，副教授，医学博士，在站博士后，大连市高层次青年人才。
    她主要从事免疫炎症与心肌重构研究，致力于结合基础发现和临床表型，探索潜在干预靶点及转化应用路径。
    近年来，她在European Heart Journal、Journal of Advanced Research、Hypertension和
    American Journal of Physiology-Heart and Circulatory Physiology等心血管领域期刊发表SCI论文35篇。

    她主持辽宁省科技厅项目1项、教育厅项目1项和校级项目2项，并作为核心成员参与3项国家自然科学基金项目。
    “趋化因子/黏附分子促进高血压及其并发症的病理生理机制”项目获大连市科学技术进步二等奖。
    她兼任中国研究型医院学会围产期母体心脏病专业委员会委员，并指导学生在全国大学生生命科学竞赛、
    全国大学生医学创新大赛暨“一带一路”国际竞赛等赛事中获得国家级和省级奖项。

hui_qu:
  name: Hui Qu
  bio: >-
    曲慧，女，中共党员，副教授，医学硕士，大连医科大学附属第二医院耳鼻咽喉科副主任医师、硕士研究生导师。
    她于2012年毕业于大连医科大学七年制临床医学专业，拥有十余年耳鼻咽喉科临床、教学和科研经验。
    2019年至2020年，她作为辽宁省第九批组团式援藏医疗队成员，担任西藏那曲市人民医院耳鼻喉科主任。
    她擅长常见耳鼻咽喉疾病诊治，重点关注儿童鼾症和鼻内镜手术，并担任多个国家级、省级和市级专业委员会委员。

    她坚持以临床问题为导向，通过深入的机制研究促进临床转化。目前主要研究鼻腔微环境及其在疾病发生中的作用，
    以及儿童腺样体、扁桃体肥大的生物力学特征及其对阻塞性睡眠呼吸暂停低通气综合征的影响，
    旨在将基础研究转化为靶向临床策略。她参与多项国家自然科学基金项目，主持2项省级科研项目，
    并在中文核心及SCI期刊发表论文9篇。

weikun_qu:
  name: Weikun Qu
  bio: >-
    曲维坤，医学博士，副教授，硕士研究生导师，大连医科大学附属第二医院肝胆外科副主任医师，中共党员。
    现任医院器官获取组织办公室主任，并兼任器官捐献管理办公室和区域医疗发展部门相关管理工作，
    长期从事器官捐献协调、移植相关临床管理、学科建设和能力提升。

    他兼任中华医学会器官移植学分会捐献与获取学组委员、中国医院协会器官捐献与移植专业委员会委员、
    辽宁省医学会器官移植学分会常务委员等学术职务。

    在科研方面，他坚持临床问题驱动、机制研究支撑的转化研究路径。自2013年以来持续开展肝胆及肾脏疾病的基础与转化研究，
    重点关注具有临床价值的科学问题，并推动机制发现向诊疗策略转化。2017年取得人体器官捐献协调员国家资格证书。
    目前主要研究肝肾损伤与修复及相关全身炎症反应，涉及器官移植、炎症免疫、肿瘤和转化医学等领域。
    他主持省级项目1项、大连市项目1项和企业合作项目1项，参与国家自然科学基金等项目，发表SCI论文8篇，获授权发明专利2项。

chang_liu:
  name: Chang Liu
  bio: >-
    刘畅，1999年出生于河南，2024年考入大连医科大学附属第二医院耳鼻咽喉科攻读硕士学位。
    她主要研究慢性鼻窦炎的分子机制，以及腺样体和扁桃体肥大对儿童面部发育的影响。

ruofei_li:
  name: Ruofei Li
  bio: >-
    李若菲，2025级心血管内科硕士研究生，导师为李静副研究员，现于大连医科大学附属第二医院心血管病研究所学习。
    她目前主要研究去泛素化酶调控阿霉素诱导心脏毒性的机制。

shijie_xu:
  name: Shijie Xu
  bio: >-
    徐世杰，大连医科大学2024级外科学硕士研究生，具有较扎实的临床技能，能够灵活运用临床思维分析问题。
    他具有良好的临床基础，熟悉文献检索和数据统计分析，并能使用相关软件完成数据处理。2025年获评优秀住院医师。

tong_wang:
  name: Tong Wang
  bio: >-
    王彤，就职于大连医科大学附属第二医院教务部，拥有物理化学与临床医学双硕士学位。
    她负责医院教学管理，为学生提供学习指导和规划建议，并擅长医工技术成果转化、应用推广以及医工交叉团队建设与协作。

xi_wan:
  name: Xi Wan
  bio: >-
    Xi Wan是王帅教授指导的2023级眼科学专业型硕士研究生，主要研究基于纳米技术的眼部药物递送系统及其在干眼多靶点治疗中的应用。
    她主持辽宁省基础研究计划优秀学生项目（2024—2026年，经费1.5万元），已申请4项专利，其中包括1项授权发明专利和1项外观设计专利。
    她获评大连市优秀毕业生，并在中国国际大学生创新大赛校赛、“挑战杯”校赛等竞赛中获奖，连续两年获得学业奖学金。

xiangyi_wang:
  name: Xiangyi Wang
  bio: >-
    Xiangyi Wang是王帅教授课题组2024级眼科学研究生，目前在大连医科大学附属第二医院接受临床与科研训练。
    在王帅教授指导下，她致力于将临床实践与科学研究相结合，探索利用人工智能模型筛选眼表来源抗菌肽，
    以期为真实临床环境中的眼科诊疗进步作出贡献。她期待在团队中持续成长，并与实验室成员共同进步。

xiaofeng_xu:
  name: Xiaofeng Xu
  bio: >-
    Xiaofeng Xu是大连医科大学2023级外科学硕士研究生，主要研究脓毒症相关急性肾损伤的机制与治疗。
    他熟练掌握基础实验技能，能够运用科研思维分析临床问题；具有良好的临床研究基础，熟悉文献检索、数据统计分析和相关软件操作。
    他在2024年中国国际大学生创新大赛校赛中获三等奖。

xinru_su:
  name: Xinru Su
  bio: >-
    Xinru Su是2024级眼科学硕士研究生，现于大连医科大学附属第二医院科研中心学习。
    她主要研究泛素—蛋白酶体系统在视网膜疾病中的作用及机制。
    她曾获中国国际大学生创新创业大赛校赛一等奖、“挑战杯”校级优秀奖和学业奖学金。

yuchen_sun:
  name: Yuchen Sun
  bio: >-
    Yuchen Sun是2025级外科学学术型硕士研究生，导师为曲维坤教授，现于大连医科大学附属第二医院公共卫生实验教学中心学习。
    其主要研究方向为维生素D治疗脓毒症相关心脏损伤的作用机制。

zechuan_li:
  name: Zechuan Li
  bio: >-
    Zechuan Li是大连医科大学眼科学专业硕士一年级研究生，导师为王帅副教授。
    他目前主要开展生长分化因子15在眼科疾病中的基础与临床研究，并积极参与课题组相关科研项目，
    致力于探索视网膜疾病的病理机制和新的治疗策略。作为课题组新成员，他希望在今后的学习中夯实科研基础、提升临床思维，
    为团队科研和学术发展作出贡献。

zhuxue_chen:
  name: Zhuxue Chen
  bio: >-
    Zhuxue Chen是大连医科大学2025级眼科学学术型硕士研究生，目前在王帅教授课题组开展研究。
    她主要关注小胶质细胞介导的炎症反应与年龄相关性黄斑变性之间的关联机制，
    通过解析免疫炎症通路的核心调控逻辑，为眼底疾病的早期干预和精准治疗提供基础实验依据。

zixuan_meng:
  name: Zixuan Meng
  bio: >-
    Zixuan Meng是王帅教授指导的2025级眼科学专业型硕士研究生，目前在大连医科大学附属第二医院接受临床和科研训练。
    她主要研究人工智能模型在干眼泪液代谢组学中的应用，旨在为疾病早期诊断和个体化治疗方案开发提供科学依据。
    她曾获辽宁省住院医师规范化培训演讲比赛省级三等奖。

collaborator_one:
  name: Huangzhao Wei
  bio: >-
    Huangzhao Wei，研究员、博士研究生导师，研究方向为化学工程。他于2008年毕业于四川农业大学，
    2013年获中国科学院大学博士学位，之后继续在中国科学院大连化学物理研究所工作，先后任副研究员和研究员。
    他长期从事纳米催化材料的可控制备与规模化成型研究，围绕高温高压氧化过程提出面向催化剂结构定向构筑的理论。
    他主持或参与国家863、973计划及科技部重点研发任务等近10项重大项目，并与伊朗、新加坡等“一带一路”国家开展科技合作。
    他拥有26项授权发明专利，相关成果累计产值25亿元，并获山东省科技进步二等奖、中国石油和化工自动化行业科技进步二等奖、
    中国环境保护产业协会环境技术进步一等奖和大连市科技进步二等奖等奖项。

collaborator_two:
  name: Pengfei Zhang
  bio: >-
    Pengfei Zhang，博士，大连理工大学光电工程与仪器科学学院教授。
    他主要从事先进生物医学光学成像与仪器研究，重点包括光学相干断层扫描、扫描激光检眼镜和自适应光学，
    致力于实现细胞分辨率的活体成像，并推动其在视网膜和眼科学研究中的创新应用。
